workflows:
  android-debug:
    name: Weyn Android validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: weynapp
    environment:
      node: 22.14.0
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - $CM_BUILD_DIR/weynapp/android/app/build/outputs/**/*.apk
      - $CM_BUILD_DIR/weynapp/android/app/build/reports/**

  ios-simulator:
    name: Weyn iOS validation
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: weynapp
    environment:
      node: 22.14.0
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build unsigned simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $CM_BUILD_DIR/weynapp/build/ios/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
